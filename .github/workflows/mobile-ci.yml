name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - align/current-dfy-fe-be

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expo Android bundle validation
        run: npx expo export --platform android --output-dir dist-android
      - name: Expo iOS bundle validation
        run: npx expo export --platform ios --output-dir dist-ios
