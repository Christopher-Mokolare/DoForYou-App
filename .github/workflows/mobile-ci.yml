name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - align/current-dfy-fe-be

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The existing lockfile is stale relative to package.json/transitive Expo dependencies.
      # Install from package.json so CI can validate the application while the lockfile is regenerated.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
